<!doctype html>
<html lang="en">

<head>
  <script>
    window.FontAwesomeConfig = {
      autoReplaceSvg: 'nest'
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet">
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clien</title>
  <script>
    tailwind.config = {
      theme:
      {
        extend:
        {
          fontFamily:
          {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors:
          {
            arena:
            {
              bg: '#0d1117',
              panel: '#161b22',
              border: '#30363d',
              text: '#c9d1d9',
              muted: '#8b949e',
              green: '#00ff41',
              greenDim: '#2ea043',
              purple: '#7c3aed',
            }
          },
          backgroundImage:
          {
            'gradient-cta': 'linear-gradient(90deg, #7c3aed 0%, #00ff41 100%)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0d1117;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0d1117;
    }

    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #8b949e;
    }

    .code-rain span {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      color: #00ff41;
      opacity: 0;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }

      10% {
        opacity: .55;
      }

      80% {
        opacity: .55;
      }

      100% {
        transform: translateY(1024px);
        opacity: 0;
      }
    }

    .live-pulse::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 9999px;
      background: #00ff41;
      opacity: .5;
      animation: livePulse 2s ease-in-out infinite;
    }

    @keyframes livePulse {

      0%,
      100% {
        transform: scale(1);
        opacity: .5;
      }

      50% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    .blink-cursor::after {
      content: '█';
      animation: blink 1s step-end infinite;
      color: #00ff41;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    .tab-active {
      color: #00ff41;
      border-bottom: 2px solid #00ff41;
    }

    .role-active {
      background: #161b22;
      color: #00ff41;
      border-color: #00ff41;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
